name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Required desktop web and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm test
      - name: Build the web app
        run: npm run build
      - name: Check the phone layouts
        run: npm run test:mobile-smoke
      # MOBILE_LAYOUTS=1 here rather than as a second step. The mobile groups
      # live inside the same three suites as the desktop checks, so running
      # `test:mobile-layouts` afterwards re-ran browser, interface and
      # navigation in full a second time — doubling CI's slowest stage to gain
      # a handful of extra assertions, and loading the runner enough to surface
      # timing flakes. One pass with the flag set covers both.
      - name: Run required desktop and mobile browser suites
        run: MOBILE_LAYOUTS=1 npm run test:web
      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Reports the result of `web` either way. It is a separate job so a red run
  # still gets announced (`if: always()`), and so a Discord outage can never
  # turn a green run red - the notifier's own failure is not the repository's
  # test result, and `continue-on-error` keeps it out of the required check.
  #
  # The subject line comes from the event payload, not from git: a pull
  # request checkout is a shallow merge commit that does not even contain the
  # head SHA being reported, so `git log` there would quietly report nothing.
  notify:
    name: Report the result to Discord
    needs: web
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Post the CI result
        env:
          DISCORD_CI_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK_URL }}
          CI_CONCLUSION: ${{ needs.web.result }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          # For a pull request the checked-out tip is the merge commit, whose
          # subject is "Merge ... into ...". Report the head commit a person
          # actually pushed instead.
          CI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_ACTOR: ${{ github.actor }}
          CI_EVENT: ${{ github.event_name }}
          CI_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SUBJECT: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-discord-ci.mjs
