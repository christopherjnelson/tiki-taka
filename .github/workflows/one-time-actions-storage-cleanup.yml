name: One-time Actions storage cleanup

on:
  push:
    branches:
      - chore/actions-storage-cleanup

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete obsolete workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts=(
            10027829096 10027781451
            10030322776 10030286320
            10030642381 10030605955
            10030653108 10030612646
            10030745076 10030703147
            10031026010 10030995507
            10031177382 10031144239
            10031936828 10031907129
            10032145628 10032107732
            10297881267 10306674981 10315591024
            10328788833 10356724584 10374838282
          )

          for artifact_id in "${artifacts[@]}"; do
            echo "Deleting artifact ${artifact_id}"
            gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/${artifact_id}" || true
          done
