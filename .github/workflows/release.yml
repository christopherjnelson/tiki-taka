name: Release artifact

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and package (for example, v0.3.0)
        required: true
        type: string

# A release build only reads the tagged source. Deployment credentials are
# intentionally not granted until a host-specific deployment is configured.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # For a published release this is its tag; manual runs must supply it.
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(node --print "require('./package.json').version")"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be exactly vX.Y.Z; got: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "$RELEASE_TAG^{commit}")" ]]; then
            echo "Checked-out commit is not exactly tagged $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=tiki-taka-$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate public Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$VITE_SUPABASE_URL" != "https://ibbprhuqzlbajuaeplgt.supabase.co" ]]; then
            echo "Repository variable VITE_SUPABASE_URL is missing or does not match the allowed production origin." >&2
            exit 1
          fi
          if [[ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "Repository variable VITE_SUPABASE_PUBLISHABLE_KEY is required." >&2
            exit 1
          fi
          if [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" == sb_secret_* ]]; then
            echo "Refusing to compile a Supabase secret key into the public browser bundle." >&2
            exit 1
          fi
      - name: Set build identity
        run: |
          # github.sha is not guaranteed to be the release commit for every
          # release event, so use the checked-out tag's commit instead.
          echo "VITE_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build the release artifact
        # Vite exposes VITE_* variables to the browser bundle. The client
        # build indicator consumes these when it is present.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Verify service-worker install-cache contract
        run: node --test tests/service-worker-contract.mjs
      - name: Verify bundle budgets
        run: node scripts/perf-budget.mjs --check
      - name: Run required desktop browser suites
        run: npm run test:web
      - name: Package static site
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          ARCHIVE="tiki-taka-${RELEASE_TAG}.tar.gz"
          tar -C dist -czf "$ARCHIVE" desktop
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Upload immutable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            tiki-taka-${{ github.event.release.tag_name || inputs.release_tag }}.tar.gz
            tiki-taka-${{ github.event.release.tag_name || inputs.release_tag }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
