name: Release artifact

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and package (for example, v0.3.0)
        required: true
        type: string

# A release build only reads the tagged source, so the workflow's default
# permissions stay read-only. The deploy job below does reach production: it
# runs only for a published Release (never a manual rebuild), takes its
# credentials from the `production` environment rather than from these
# permissions, and ships the artifact this same run built.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # For a published release this is its tag; manual runs must supply it.
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(node --print "require('./package.json').version")"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be exactly vX.Y.Z; got: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "$RELEASE_TAG^{commit}")" ]]; then
            echo "Checked-out commit is not exactly tagged $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=tiki-taka-$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate public Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ "$VITE_SUPABASE_URL" != "https://ibbprhuqzlbajuaeplgt.supabase.co" ]]; then
            echo "Repository variable VITE_SUPABASE_URL is missing or does not match the allowed production origin." >&2
            exit 1
          fi
          if [[ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "Repository variable VITE_SUPABASE_PUBLISHABLE_KEY is required." >&2
            exit 1
          fi
          if [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" == sb_secret_* ]]; then
            echo "Refusing to compile a Supabase secret key into the public browser bundle." >&2
            exit 1
          fi
      - name: Set build identity
        run: |
          # github.sha is not guaranteed to be the release commit for every
          # release event, so use the checked-out tag's commit instead.
          echo "VITE_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build the release artifact
        # Vite exposes VITE_* variables to the browser bundle. The client
        # build indicator consumes these when it is present.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Verify service-worker install-cache contract
        run: node --test tests/service-worker-contract.mjs
      - name: Verify bundle budgets
        run: node scripts/perf-budget.mjs --check
      - name: Run required desktop browser suites
        run: npm run test:web
      - name: Package static site
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          ARCHIVE="tiki-taka-${RELEASE_TAG}.tar.gz"
          tar -C dist -czf "$ARCHIVE" desktop
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Upload immutable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            tiki-taka-${{ github.event.release.tag_name || inputs.release_tag }}.tar.gz
            tiki-taka-${{ github.event.release.tag_name || inputs.release_tag }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified release to production
    needs: build
    # Manual dispatch rebuilds an artifact; only publishing a Release deploys.
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: tiki-taka-production
      cancel-in-progress: false
    steps:
      - name: Download artifact produced by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifact
      - name: Verify artifact and configure pinned SSH host
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          ARCHIVE="release-artifact/tiki-taka-${RELEASE_TAG}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"
          test -f "$ARCHIVE" && test -f "$CHECKSUM"
          (cd release-artifact && sha256sum --check --strict "$(basename "$CHECKSUM")")
          install -d -m 700 "$RUNNER_TEMP/tiki-taka-ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/tiki-taka-ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/tiki-taka-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/tiki-taka-ssh/known_hosts" "$RUNNER_TEMP/tiki-taka-ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/tiki-taka-ssh/id_ed25519" >/dev/null
          KNOWN_HOST="$DEPLOY_HOST"
          [[ "$DEPLOY_PORT" == 22 ]] || KNOWN_HOST="[$DEPLOY_HOST]:$DEPLOY_PORT"
          ssh-keygen -F "$KNOWN_HOST" -f "$RUNNER_TEMP/tiki-taka-ssh/known_hosts" >/dev/null || {
            echo "DEPLOY_KNOWN_HOSTS has no entry for DEPLOY_HOST" >&2
            exit 1
          }
          printf 'DEPLOY_PORT=%s\nARCHIVE=%s\nCHECKSUM=%s\n' "$DEPLOY_PORT" "$ARCHIVE" "$CHECKSUM" >> "$GITHUB_ENV"
      - name: Upload verified artifact to isolated incoming directory
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/tiki-taka-ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/tiki-taka-ssh/known_hosts")
          SCP=(scp -P "$DEPLOY_PORT" -i "$RUNNER_TEMP/tiki-taka-ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/tiki-taka-ssh/known_hosts")
          INCOMING="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" /srv/tiki-taka/bin/prepare-incoming "$INCOMING"
          "${SCP[@]}" "$ARCHIVE" "$CHECKSUM" "$DEPLOY_USER@$DEPLOY_HOST:/srv/tiki-taka/incoming/$INCOMING/"
      - name: Atomically activate release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          set -euo pipefail
          SSH=(ssh -p "$DEPLOY_PORT" -i "$RUNNER_TEMP/tiki-taka-ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/tiki-taka-ssh/known_hosts")
          INCOMING="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" /srv/tiki-taka/bin/activate-release \
            "$INCOMING" "$RELEASE_TAG" "$RELEASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

  notify:
    name: Announce production deployment
    needs: [build, deploy]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out release history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.release_tag }}
          fetch-depth: 0
      # Two audiences, two channels. The step below this one is the
      # engineering summary - commits, SHAs, a workflow link - for the private
      # team channel. This one posts the player-facing notes, straight from
      # CHANGELOG.md, to the public releases channel.
      #
      # continue-on-error on purpose: the release is already deployed and
      # verified by the time either of these runs, so a Discord outage or a
      # rotated webhook must not colour a successful deployment red. A failure
      # here is visible in the job's annotations.
      - name: Post player-facing release notes to the public channel
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PRODUCTION_URL: https://tiki-taka.chris.guru
          DEPLOYED_AT: ${{ github.event.release.published_at }}
        run: node scripts/notify-discord-player-release.mjs

      - name: Send rich Discord deployment announcement
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
          PRODUCTION_URL: https://tiki-taka.chris.guru
          DEPLOYED_AT: ${{ github.event.release.published_at }}
        run: node scripts/notify-discord-release.mjs
